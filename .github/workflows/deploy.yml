name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Google Calendar token server (worker/). Deployed only when the Cloudflare and
  # Google secrets are set; without them the app falls back to hourly Google sign-in.
  worker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or GOOGLE_CLIENT_SECRET is not set — skipping the Google Calendar token server."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx -y wrangler@4 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx -y wrangler@4 secret put GOOGLE_CLIENT_SECRET
      - name: Push key (created once)
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          # The private VAPID key only ever lives as a Worker secret.
          if ! npx -y wrangler@4 secret list 2>/dev/null | grep -q VAPID_JWK; then
            node -e "crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(k=>crypto.subtle.exportKey('jwk',k.privateKey)).then(j=>process.stdout.write(JSON.stringify(j)))" \
              | npx -y wrangler@4 secret put VAPID_JWK
          fi
      - name: Worker URL
        id: url
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          url="$DEPLOYED"
          if [ -z "$url" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty') || sub=""
            [ -n "$sub" ] && url="https://plano-gcal.$sub.workers.dev"
          fi
          echo "Token server: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  build:
    needs: worker
    # Runs for pull requests (worker skipped) and even if the worker deploy failed.
    if: ${{ !cancelled() }}
    # Pinned: Playwright 1.56 has no browser build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Real-browser checks (desktop + phone) on a local-preview build; a failure stops the deploy.
      # The browser comes from Playwright's CDN and is cached between runs (keyed by the lockfile, which
      # pins the Playwright version). Its system libraries are already on the runner image: installing
      # them through apt is what hung for 10 minutes when the Ubuntu mirrors were unreachable.
      - name: Cache the test browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the test browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # Behaviour and accessibility (axe) on desktop and phone profiles; a failure stops the deploy.
      - run: npm run e2e
      # Screenshots against the committed baselines. Informational: it reports a changed look but does
      # not block a deploy (renders can differ slightly between machines). Diffs are kept as an artifact.
      - name: Visual regression (informational)
        id: visual
        continue-on-error: true
        run: npm run e2e:visual
      - name: Keep the visual diffs
        if: steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14
      - name: Build
        run: npm run build
        env:
          # Served from the custom domain plano.edvault.online, so the app lives at the root.
          # Without a custom domain this would be /<repo-name>/.
          VITE_BASE_PATH: /
          # Google Calendar token server; empty → hourly Google sign-in.
          VITE_GCAL_TOKEN_URL: ${{ needs.worker.outputs.url || vars.GCAL_TOKEN_URL }}
          # Firebase web config is read from the committed .env.production.
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Security rules of the Realtime Database, tested against the Firebase emulator (needs Java).
  # Runs next to the build; a failure shows as a red check on the commit but does not hold the deploy,
  # because the emulator and its tools are downloaded on every run and a network hiccup must not block it.
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Cache the emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package.json') }}
      - run: npm run test:rules

  deploy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
