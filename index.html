<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>html,body{background:#0D0D0F}</style>
    <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Plano — Твоє життя. В одному місці." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plano" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- splash:start -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1242x2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%BASE_URL%splash/828x1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1242x2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%BASE_URL%splash/750x1334.png" />
    <!-- splash:end -->
    <style>
      /* Loading screen: the mascot fills the width along the bottom (a phone) or stands centred (a desktop);
         a spinner sits in the free space above it. Used by #boot below and by <SplashScreen>. */
      .splash{position:relative;min-height:100dvh;overflow:hidden;background:#0d0d0f;color:#8b8b93;font-family:system-ui,sans-serif}
      .splash-duck{position:absolute;left:50%;bottom:0;width:min(100vw,62dvh);aspect-ratio:1;transform:translateX(-50%);object-fit:cover;pointer-events:none;user-select:none}
      @media (min-width:700px){.splash-duck{-webkit-mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to right,transparent,#000 14%,#000 86%,transparent)}}
      .splash-center{position:absolute;left:0;right:0;top:42%;display:flex;flex-direction:column;align-items:center;gap:20px;transform:translateY(-50%)}
      .splash-spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.7);animation:splash-spin .8s linear infinite}
      @keyframes boot{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.splash-spin{animation-duration:2s}}
    </style>
    <link rel="preload" as="image" href="%BASE_URL%splash-duck.webp" type="image/webp" />
    <title>Plano</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('plano:theme') || 'light';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.accent = localStorage.getItem('plano:accent') || 'coral';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.removeAttribute('media');
            m.setAttribute('content', '#0D0D0F');
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" class="splash" role="status" aria-label="Завантаження Plano">
        <img class="splash-duck" src="%BASE_URL%splash-duck.webp" width="960" height="960" alt="" fetchpriority="high" />
        <div class="splash-center">
          <div class="splash-spin"></div>
        </div>
        <noscript>Для роботи Plano потрібен JavaScript.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
